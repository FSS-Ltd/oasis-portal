name: Reconcile accepted parent invitations

on:
  workflow_dispatch:
    inputs:
      apply:
        description: Apply the confirmed reconciliation. Leave false for a dry run.
        required: true
        default: false
        type: boolean

concurrency:
  group: production-parent-invitation-reconciliation
  cancel-in-progress: false

permissions:
  contents: read

env:
  NODE_VERSION: '20'
  PNPM_VERSION: '10.0.0'

jobs:
  reconcile:
    name: Reconcile accepted parent invitations
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: Prod Maintenance
    env:
      DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
      CLERK_SECRET_KEY: ${{ secrets.PROD_CLERK_SECRET_KEY }}
      OASIS_MASTER_KEY: ${{ secrets.PROD_OASIS_MASTER_KEY }}
      OASIS_MASTER_KEY_VERSION: ${{ secrets.PROD_OASIS_MASTER_KEY_VERSION }}
      OASIS_BIDX_PEPPER: ${{ secrets.PROD_OASIS_BIDX_PEPPER }}

    steps:
      - uses: actions/checkout@v6

      - name: Require the main branch
        run: |
          if [ "${GITHUB_REF}" != 'refs/heads/main' ]; then
            echo 'This production maintenance workflow may only run from main.' >&2
            exit 1
          fi

      - name: Enable corepack (pnpm)
        run: |
          corepack enable
          corepack prepare pnpm@${PNPM_VERSION} --activate

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @oasis/db generate

      - name: Validate production maintenance secrets
        run: |
          missing=()
          for name in DATABASE_URL CLERK_SECRET_KEY OASIS_MASTER_KEY OASIS_MASTER_KEY_VERSION OASIS_BIDX_PEPPER; do
            if [ -z "${!name}" ]; then
              missing+=("${name}")
            fi
          done

          if [ "${#missing[@]}" -gt 0 ]; then
            printf 'Missing required production secrets: %s\n' "${missing[*]}" >&2
            exit 1
          fi

      - name: Expose the active encryption key
        run: |
          if ! [[ "${OASIS_MASTER_KEY_VERSION}" =~ ^[1-9][0-9]*$ ]]; then
            echo 'OASIS_MASTER_KEY_VERSION must be a positive integer.' >&2
            exit 1
          fi

          if [ "${OASIS_MASTER_KEY_VERSION}" != '1' ]; then
            echo "OASIS_MASTER_KEY_V${OASIS_MASTER_KEY_VERSION}=${OASIS_MASTER_KEY}" >> "${GITHUB_ENV}"
          fi

      - name: Dry run accepted parent invitation reconciliation
        if: ${{ !inputs.apply }}
        run: pnpm --filter @oasis/api exec tsx scripts/reconcile-accepted-parent-invitations.ts

      - name: Apply accepted parent invitation reconciliation
        if: ${{ inputs.apply }}
        run: pnpm --filter @oasis/api exec tsx scripts/reconcile-accepted-parent-invitations.ts --apply
