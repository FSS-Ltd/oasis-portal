name: Mobile native build

# Builds the app natively (Xcode and Gradle, the same projects Android Studio and Xcode open)
# whenever mobile code lands on main. ios/ and android/ are generated by `expo prebuild` each run.
# - Android: a release APK signed with the debug key, kept as a workflow artifact for sideloading.
# - iOS: an unsigned simulator build that proves the app still compiles. Testers use TestFlight,
#   which mobile-release.yml feeds on each version bump.
# Push notifications still go through Expo's push service; that needs no build service.
on:
  push:
    branches: [main]
    paths:
      - 'apps/mobile/**'
      - 'packages/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/mobile-native-build.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-native-build
  cancel-in-progress: true

env:
  NODE_VERSION: '20'
  PNPM_VERSION: '10.0.0'

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: mobile-preview
    env:
      EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ vars.EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY }}
      EXPO_PUBLIC_TRPC_URL: ${{ vars.EXPO_PUBLIC_TRPC_URL }}
      EXPO_PUBLIC_SUPABASE_URL: ${{ vars.EXPO_PUBLIC_SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
      GOOGLE_SERVICES_JSON_CONTENT: ${{ secrets.GOOGLE_SERVICES_JSON }}
    steps:
      - uses: actions/checkout@v6

      - name: Enable corepack (pnpm)
        run: |
          corepack enable
          corepack prepare pnpm@${{ env.PNPM_VERSION }} --activate

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install
        run: pnpm install --frozen-lockfile --filter "@oasis/mobile..."

      # app.config.js reads the file path from GOOGLE_SERVICES_JSON. Without it push is off on Android.
      - name: Write Firebase config
        if: env.GOOGLE_SERVICES_JSON_CONTENT != ''
        run: |
          printf '%s' "${GOOGLE_SERVICES_JSON_CONTENT}" > "${RUNNER_TEMP}/google-services.json"
          echo "GOOGLE_SERVICES_JSON=${RUNNER_TEMP}/google-services.json" >> "${GITHUB_ENV}"

      - name: Generate Android project
        working-directory: apps/mobile
        run: npx expo prebuild --platform android --clean --no-install

      - name: Build APK
        working-directory: apps/mobile/android
        run: ./gradlew :app:assembleRelease --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: oasis-android-${{ github.sha }}
          path: apps/mobile/android/app/build/outputs/apk/release/app-release.apk
          retention-days: 14

  ios:
    name: iOS compile check
    runs-on: macos-26
    timeout-minutes: 60
    environment: mobile-preview
    env:
      # CocoaPods fails without a UTF-8 locale.
      LANG: en_US.UTF-8
      EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ vars.EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY }}
      EXPO_PUBLIC_TRPC_URL: ${{ vars.EXPO_PUBLIC_TRPC_URL }}
      EXPO_PUBLIC_SUPABASE_URL: ${{ vars.EXPO_PUBLIC_SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - uses: actions/checkout@v6

      - name: Enable corepack (pnpm)
        run: |
          corepack enable
          corepack prepare pnpm@${{ env.PNPM_VERSION }} --activate

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile --filter "@oasis/mobile..."

      # Also runs `pod install`.
      - name: Generate iOS project
        working-directory: apps/mobile
        run: npx expo prebuild --platform ios --clean

      - name: Build for simulator
        working-directory: apps/mobile/ios
        run: >-
          xcodebuild build -workspace Oasis.xcworkspace -scheme Oasis -configuration Release
          -sdk iphonesimulator -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO
