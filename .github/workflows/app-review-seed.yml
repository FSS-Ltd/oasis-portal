name: App Review Seed

# Rebuilds the app store review sandbox in the production database: the `review` schema and the
# three username-only Clerk logins (docs/app-review-tenant.md). Run it before a store submission.
# Do not run it while Apple or Google are reviewing: it wipes sandbox data, resets all three
# passwords and signs the reviewers out.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type "reset-review-schema" to wipe and reseed the review sandbox.
        required: true
        type: string

concurrency:
  group: app-review-seed
  cancel-in-progress: false

permissions:
  contents: read

env:
  NODE_VERSION: '20'
  PNPM_VERSION: '10.0.0'

jobs:
  seed:
    name: Seed app review sandbox
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.ref == 'refs/heads/main'
    # Protected environment: add a required reviewer. GitHub only exposes a secret that is named
    # below, so every key the seed needs is mapped here. Vercel withholds sensitive values from
    # `vercel pull`, so the Clerk and encryption keys must be secrets in this environment, with the
    # same values as Vercel production. The seed checks the encryption keys against live data.
    environment: Oasis Review
    env:
      DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
      DIRECT_URL: ${{ secrets.PROD_DIRECT_URL }}
      CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
      OASIS_MASTER_KEY: ${{ secrets.OASIS_MASTER_KEY }}
      OASIS_MASTER_KEY_VERSION: ${{ secrets.OASIS_MASTER_KEY_VERSION }}
      OASIS_BIDX_PEPPER: ${{ secrets.OASIS_BIDX_PEPPER }}
      OASIS_APP_REVIEW_STAFF_PASSWORD: ${{ secrets.OASIS_APP_REVIEW_STAFF_PASSWORD }}
      OASIS_APP_REVIEW_PARENT_PASSWORD: ${{ secrets.OASIS_APP_REVIEW_PARENT_PASSWORD }}
      OASIS_APP_REVIEW_DELETE_PASSWORD: ${{ secrets.OASIS_APP_REVIEW_DELETE_PASSWORD }}
      OASIS_APP_REVIEW_SEED_CONFIRMATION: ${{ inputs.confirm }}

    steps:
      - uses: actions/checkout@v6

      - name: Enable corepack (pnpm)
        run: |
          corepack enable
          corepack prepare pnpm@${{ env.PNPM_VERSION }} --activate

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @oasis/db generate

      - name: Validate seed secrets
        run: |
          node scripts/require-env-file-keys.mjs --process-env \
            DATABASE_URL \
            DIRECT_URL \
            CLERK_SECRET_KEY \
            OASIS_MASTER_KEY \
            OASIS_MASTER_KEY_VERSION \
            OASIS_BIDX_PEPPER \
            OASIS_APP_REVIEW_STAFF_PASSWORD \
            OASIS_APP_REVIEW_PARENT_PASSWORD \
            OASIS_APP_REVIEW_DELETE_PASSWORD

      - name: Rebuild review schema
        run: pnpm --filter @oasis/db review:schema --recreate

      - name: Seed review data and logins
        run: pnpm --filter @oasis/api seed:app-review
