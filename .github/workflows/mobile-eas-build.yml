name: Mobile EAS build

# Submits the internal iOS and Android builds to expo.dev whenever mobile code lands on main.
# Store builds run from mobile-release.yml when the version in apps/mobile/app.json changes.
on:
  push:
    branches: [main]
    paths:
      - 'apps/mobile/**'
      - 'packages/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/mobile-eas-build.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_VERSION: '20'
  PNPM_VERSION: '10.0.0'

jobs:
  build:
    name: EAS ${{ matrix.profile }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ios
            profile: internal-ios
          - platform: android
            profile: internal-android

    env:
      EXPO_TOKEN: ${{ secrets.EXPO_ACCESS_TOKEN }}

    steps:
      - uses: actions/checkout@v6

      - name: Validate EAS build secret
        run: |
          if [ -z "${EXPO_TOKEN}" ]; then
            echo "Missing required GitHub Actions secret: EXPO_ACCESS_TOKEN" >&2
            echo "Create an Expo access token and add it before running EAS build jobs." >&2
            exit 1
          fi

      - name: Enable corepack (pnpm)
        run: |
          corepack enable
          corepack prepare pnpm@${{ env.PNPM_VERSION }} --activate

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      # eas-cli runs `expo config` locally, which resolves plugins such as expo-router from node_modules.
      - name: Install
        run: pnpm install --frozen-lockfile --filter "@oasis/mobile..."

      - uses: expo/expo-github-action@v8
        with:
          eas-version: 13.x
          token: ${{ secrets.EXPO_ACCESS_TOKEN }}

      - name: Validate EAS config
        working-directory: apps/mobile
        run: node scripts/check-eas-build-config.mjs

      # --no-wait queues the build on expo.dev and returns, so CI minutes are not spent waiting.
      - name: Submit build to EAS
        working-directory: apps/mobile
        run: eas build --platform ${{ matrix.platform }} --profile ${{ matrix.profile }} --non-interactive --no-wait
