name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'
  PNPM_VERSION: '10.0.0'

jobs:
  verify:
    name: Lint / Typecheck / Test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: oasis
          POSTGRES_PASSWORD: oasis
          POSTGRES_DB: oasis_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U oasis"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://oasis:oasis@localhost:5432/oasis_test
      DIRECT_URL: postgres://oasis:oasis@localhost:5432/oasis_test
      # Stub values so the encryption helper and blind-index code load.
      OASIS_MASTER_KEY: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
      OASIS_MASTER_KEY_VERSION: '1'
      OASIS_BIDX_PEPPER: ci-pepper

    steps:
      - uses: actions/checkout@v4

      - name: Enable corepack (pnpm)
        run: |
          corepack enable
          corepack prepare pnpm@${{ env.PNPM_VERSION }} --activate

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @oasis/db generate

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

  db-integration:
    name: DB migration / RLS smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: oasis
          POSTGRES_PASSWORD: oasis
          POSTGRES_DB: oasis_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U oasis"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://oasis:oasis@localhost:5432/oasis_test
      DIRECT_URL: postgres://oasis:oasis@localhost:5432/oasis_test
      OASIS_MASTER_KEY: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
      OASIS_MASTER_KEY_VERSION: '1'
      OASIS_BIDX_PEPPER: ci-pepper

    steps:
      - uses: actions/checkout@v4

      - name: Enable corepack (pnpm)
        run: |
          corepack enable
          corepack prepare pnpm@${{ env.PNPM_VERSION }} --activate

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @oasis/db generate

      - name: Migrate and apply RLS
        run: pnpm db:migrate

      - name: RLS smoke
        run: pnpm db:integration
