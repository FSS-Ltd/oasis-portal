name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: '20'
  PNPM_VERSION: '10.0.0'
  TURBO_CACHE_DIR: .turbo/cache
  VERCEL_CLI_VERSION: '53.0.1'

jobs:
  verify:
    name: Lint / Typecheck / Test
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: oasis
          POSTGRES_PASSWORD: oasis
          POSTGRES_DB: oasis_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U oasis"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://oasis:oasis@localhost:5432/oasis_test
      DIRECT_URL: postgres://oasis:oasis@localhost:5432/oasis_test
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ secrets.TURBO_TEAM }}
      TURBO_REMOTE_CACHE_SIGNATURE_KEY: ${{ secrets.TURBO_REMOTE_CACHE_SIGNATURE_KEY }}

    steps:
      - uses: actions/checkout@v6

      - name: Enable corepack (pnpm)
        run: |
          corepack enable
          corepack prepare pnpm@${{ env.PNPM_VERSION }} --activate

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      - name: Restore Turbo cache
        if: github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/cache@v5
        with:
          path: .turbo/cache
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @oasis/db generate

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

  preview-changes:
    name: Detect preview deploy changes
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    outputs:
      preview_required: ${{ steps.detect.outputs.preview_required }}

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Detect deploy-relevant files
        id: detect
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          preview_required=false
          changed_files="$(git diff --name-only "${BASE_SHA}" "${HEAD_SHA}")"

          while IFS= read -r path; do
            case "${path}" in
              .github/workflows/*|apps/api/*|apps/web/*|packages/*|package.json|pnpm-lock.yaml|pnpm-workspace.yaml|scripts/*|turbo.json|tsconfig*)
                preview_required=true
                break
                ;;
            esac
          done <<< "${changed_files}"

          echo "preview_required=${preview_required}" >> "${GITHUB_OUTPUT}"

          if [ "${preview_required}" = "true" ]; then
            echo "Preview deployment required because deploy-relevant files changed." >> "${GITHUB_STEP_SUMMARY}"
          else
            echo "Preview deployment skipped because only non-deploy files changed." >> "${GITHUB_STEP_SUMMARY}"
          fi

  pwa-preview-changes:
    name: Detect PWA preview deploy changes
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    outputs:
      preview_required: ${{ steps.detect.outputs.preview_required }}

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Detect PWA deploy-relevant files
        id: detect
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          preview_required=false
          changed_files="$(git diff --name-only "${BASE_SHA}" "${HEAD_SHA}")"

          while IFS= read -r path; do
            case "${path}" in
              .github/workflows/*|apps/mobile/*|package.json|pnpm-lock.yaml|pnpm-workspace.yaml|scripts/*|turbo.json|tsconfig*)
                preview_required=true
                break
                ;;
            esac
          done <<< "${changed_files}"

          echo "preview_required=${preview_required}" >> "${GITHUB_OUTPUT}"

          if [ "${preview_required}" = "true" ]; then
            echo "PWA preview deployment required because mobile app deploy-relevant files changed." >> "${GITHUB_STEP_SUMMARY}"
          else
            echo "PWA preview deployment skipped because no mobile app deploy-relevant files changed." >> "${GITHUB_STEP_SUMMARY}"
          fi

  deploy-preview:
    name: Vercel preview deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [verify, preview-changes]
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && needs.preview-changes.outputs.preview_required == 'true'

    permissions:
      contents: read
      pull-requests: write

    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_TELEMETRY_DISABLED: '1'
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ secrets.TURBO_TEAM }}
      TURBO_REMOTE_CACHE_SIGNATURE_KEY: ${{ secrets.TURBO_REMOTE_CACHE_SIGNATURE_KEY }}

    steps:
      - uses: actions/checkout@v6

      - name: Enable corepack (pnpm)
        run: |
          corepack enable
          corepack prepare pnpm@${{ env.PNPM_VERSION }} --activate

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      - name: Restore Next.js build cache
        uses: actions/cache@v5
        with:
          path: apps/web/.next/cache
          key: ${{ runner.os }}-next-preview-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('apps/web/**', 'apps/api/**', 'packages/**', 'package.json', 'turbo.json') }}
          restore-keys: |
            ${{ runner.os }}-next-preview-${{ hashFiles('pnpm-lock.yaml') }}-
            ${{ runner.os }}-next-preview-

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @oasis/db generate

      - name: Validate Vercel CI secrets
        run: |
          missing=()
          for name in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID; do
            if [ -z "${!name}" ]; then
              missing+=("${name}")
            fi
          done

          if [ "${#missing[@]}" -gt 0 ]; then
            printf 'Missing required GitHub Actions secrets: %s\n' "${missing[*]}" >&2
            printf 'Add the missing secrets under repository Settings > Secrets and variables > Actions before running Vercel deploy jobs.\n' >&2
            exit 1
          fi

      - name: Install Vercel CLI
        run: |
          npm config set fetch-retries 5
          npm config set fetch-retry-factor 2
          npm config set fetch-retry-mintimeout 20000
          npm config set fetch-retry-maxtimeout 120000

          for attempt in 1 2 3; do
            if npm install --global "vercel@${VERCEL_CLI_VERSION}"; then
              exit 0
            fi

            if [ "${attempt}" = "3" ]; then
              exit 1
            fi

            sleep $((attempt * 10))
          done

      - name: Pull Vercel preview environment
        run: vercel pull --yes --environment=preview

      - name: Validate GitHub preview build environment
        run: |
          node scripts/require-env-file-keys.mjs --process-env \
            NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY \
            NEXT_PUBLIC_SUPABASE_URL \
            NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY

      - name: Build preview deployment
        run: vercel build

      - name: Deploy preview
        id: deploy
        run: |
          deployment_url="$(vercel deploy --prebuilt --archive=tgz)"
          echo "url=${deployment_url}" >> "${GITHUB_OUTPUT}"
          echo "Preview deployment: ${deployment_url}" >> "${GITHUB_STEP_SUMMARY}"

      - name: Comment preview URL
        uses: actions/github-script@v9
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `Vercel preview: ${{ steps.deploy.outputs.url }}`
            })

  deploy-pwa-preview:
    name: Vercel PWA preview deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [verify, pwa-preview-changes]
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && needs.pwa-preview-changes.outputs.preview_required == 'true'

    permissions:
      contents: read
      pull-requests: write

    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      OASIS_APP_VERCEL_PROJECT_ID: ${{ secrets.OASIS_APP_VERCEL_PROJECT_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.OASIS_APP_VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_TELEMETRY_DISABLED: '1'
      EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
      EXPO_PUBLIC_TRPC_URL: ${{ secrets.EXPO_PUBLIC_TRPC_URL }}

    steps:
      - uses: actions/checkout@v6

      - name: Enable corepack (pnpm)
        run: |
          corepack enable
          corepack prepare pnpm@${{ env.PNPM_VERSION }} --activate

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Validate PWA preview deploy secrets
        run: |
          missing=()
          for name in VERCEL_TOKEN VERCEL_ORG_ID OASIS_APP_VERCEL_PROJECT_ID EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY EXPO_PUBLIC_TRPC_URL; do
            if [ -z "${!name}" ]; then
              missing+=("${name}")
            fi
          done

          if [ "${#missing[@]}" -gt 0 ]; then
            printf 'Missing required GitHub Actions secrets: %s\n' "${missing[*]}" >&2
            printf 'Add the missing secrets before running Oasis app PWA deploy jobs.\n' >&2
            exit 1
          fi

      - name: Install Vercel CLI
        run: |
          npm config set fetch-retries 5
          npm config set fetch-retry-factor 2
          npm config set fetch-retry-mintimeout 20000
          npm config set fetch-retry-maxtimeout 120000

          for attempt in 1 2 3; do
            if npm install --global "vercel@${VERCEL_CLI_VERSION}"; then
              exit 0
            fi

            if [ "${attempt}" = "3" ]; then
              exit 1
            fi

            sleep $((attempt * 10))
          done

      - name: Link Vercel PWA project
        run: |
          mkdir -p apps/mobile/.vercel
          printf '{"orgId":"%s","projectId":"%s"}\n' "${VERCEL_ORG_ID}" "${OASIS_APP_VERCEL_PROJECT_ID}" > apps/mobile/.vercel/project.json

      - name: Build PWA preview artifact
        run: pnpm --filter @oasis/mobile build:web

      - name: Deploy PWA preview
        id: deploy
        run: |
          deployment_url="$(vercel deploy dist --cwd apps/mobile --archive=tgz --yes)"
          echo "url=${deployment_url}" >> "${GITHUB_OUTPUT}"
          echo "PWA preview deployment: ${deployment_url}" >> "${GITHUB_STEP_SUMMARY}"

      - name: Comment PWA preview URL
        uses: actions/github-script@v9
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `Oasis app PWA preview: ${{ steps.deploy.outputs.url }}`
            })

  deploy-production:
    name: Vercel production deploy
    runs-on: ubuntu-latest
    timeout-minutes: 25
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    env:
      DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
      DIRECT_URL: ${{ secrets.PROD_DIRECT_URL }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_TELEMETRY_DISABLED: '1'
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ secrets.TURBO_TEAM }}
      TURBO_REMOTE_CACHE_SIGNATURE_KEY: ${{ secrets.TURBO_REMOTE_CACHE_SIGNATURE_KEY }}

    steps:
      - uses: actions/checkout@v6

      - name: Enable corepack (pnpm)
        run: |
          corepack enable
          corepack prepare pnpm@${{ env.PNPM_VERSION }} --activate

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      - name: Restore Next.js build cache
        uses: actions/cache@v5
        with:
          path: apps/web/.next/cache
          key: ${{ runner.os }}-next-production-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('apps/web/**', 'apps/api/**', 'packages/**', 'package.json', 'turbo.json') }}
          restore-keys: |
            ${{ runner.os }}-next-production-${{ hashFiles('pnpm-lock.yaml') }}-
            ${{ runner.os }}-next-production-

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @oasis/db generate

      - name: Validate production deploy secrets
        run: |
          missing=()
          for name in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID; do
            if [ -z "${!name}" ]; then
              missing+=("${name}")
            fi
          done

          if [ -z "${DATABASE_URL}" ]; then
            missing+=("PROD_DATABASE_URL")
          fi

          if [ -z "${DIRECT_URL}" ]; then
            missing+=("PROD_DIRECT_URL")
          fi

          if [ "${#missing[@]}" -gt 0 ]; then
            printf 'Missing required GitHub Actions secrets: %s\n' "${missing[*]}" >&2
            printf 'Add the missing secrets under repository Settings > Secrets and variables > Actions before running production deploy jobs.\n' >&2
            exit 1
          fi

      - name: Apply production database migrations
        run: pnpm db:migrate

      - name: Install Vercel CLI
        run: |
          npm config set fetch-retries 5
          npm config set fetch-retry-factor 2
          npm config set fetch-retry-mintimeout 20000
          npm config set fetch-retry-maxtimeout 120000

          for attempt in 1 2 3; do
            if npm install --global "vercel@${VERCEL_CLI_VERSION}"; then
              exit 0
            fi

            if [ "${attempt}" = "3" ]; then
              exit 1
            fi

            sleep $((attempt * 10))
          done

      - name: Pull Vercel production environment
        run: vercel pull --yes --environment=production

      - name: Validate GitHub production build environment
        run: |
          node scripts/require-env-file-keys.mjs --process-env \
            NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY \
            NEXT_PUBLIC_SUPABASE_URL \
            NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY

      - name: Build production deployment
        run: vercel build --prod

      - name: Deploy production
        id: deploy
        run: |
          deployment_url="$(vercel deploy --prebuilt --prod --archive=tgz)"
          echo "url=${deployment_url}" >> "${GITHUB_OUTPUT}"
          echo "Production deployment: ${deployment_url}" >> "${GITHUB_STEP_SUMMARY}"

  deploy-pwa-production:
    name: Vercel PWA production deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [deploy-production]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      OASIS_APP_VERCEL_PROJECT_ID: ${{ secrets.OASIS_APP_VERCEL_PROJECT_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.OASIS_APP_VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_TELEMETRY_DISABLED: '1'
      EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
      EXPO_PUBLIC_TRPC_URL: ${{ secrets.EXPO_PUBLIC_TRPC_URL }}

    steps:
      - uses: actions/checkout@v6

      - name: Enable corepack (pnpm)
        run: |
          corepack enable
          corepack prepare pnpm@${{ env.PNPM_VERSION }} --activate

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Validate PWA production deploy secrets
        run: |
          missing=()
          for name in VERCEL_TOKEN VERCEL_ORG_ID OASIS_APP_VERCEL_PROJECT_ID EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY EXPO_PUBLIC_TRPC_URL; do
            if [ -z "${!name}" ]; then
              missing+=("${name}")
            fi
          done

          if [ "${#missing[@]}" -gt 0 ]; then
            printf 'Missing required GitHub Actions secrets: %s\n' "${missing[*]}" >&2
            printf 'Add the missing secrets before running Oasis app PWA production deploys.\n' >&2
            exit 1
          fi

      - name: Install Vercel CLI
        run: |
          npm config set fetch-retries 5
          npm config set fetch-retry-factor 2
          npm config set fetch-retry-mintimeout 20000
          npm config set fetch-retry-maxtimeout 120000

          for attempt in 1 2 3; do
            if npm install --global "vercel@${VERCEL_CLI_VERSION}"; then
              exit 0
            fi

            if [ "${attempt}" = "3" ]; then
              exit 1
            fi

            sleep $((attempt * 10))
          done

      - name: Link Vercel PWA project
        run: |
          mkdir -p apps/mobile/.vercel
          printf '{"orgId":"%s","projectId":"%s"}\n' "${VERCEL_ORG_ID}" "${OASIS_APP_VERCEL_PROJECT_ID}" > apps/mobile/.vercel/project.json

      - name: Build PWA production artifact
        run: pnpm --filter @oasis/mobile build:web

      - name: Deploy PWA production
        id: deploy
        run: |
          deployment_url="$(vercel deploy dist --cwd apps/mobile --prod --archive=tgz --yes)"
          echo "url=${deployment_url}" >> "${GITHUB_OUTPUT}"
          echo "PWA production deployment: ${deployment_url}" >> "${GITHUB_STEP_SUMMARY}"
