name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: '20'
  PNPM_VERSION: '10.0.0'
  VERCEL_CLI_VERSION: '53.0.1'

jobs:
  verify:
    name: Lint / Typecheck / Test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: oasis
          POSTGRES_PASSWORD: oasis
          POSTGRES_DB: oasis_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U oasis"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://oasis:oasis@localhost:5432/oasis_test
      DIRECT_URL: postgres://oasis:oasis@localhost:5432/oasis_test

    steps:
      - uses: actions/checkout@v4

      - name: Enable corepack (pnpm)
        run: |
          corepack enable
          corepack prepare pnpm@${{ env.PNPM_VERSION }} --activate

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @oasis/db generate

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

  db-integration:
    name: DB migration / RLS smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: oasis
          POSTGRES_PASSWORD: oasis
          POSTGRES_DB: oasis_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U oasis"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://oasis:oasis@localhost:5432/oasis_test
      DIRECT_URL: postgres://oasis:oasis@localhost:5432/oasis_test

    steps:
      - uses: actions/checkout@v4

      - name: Enable corepack (pnpm)
        run: |
          corepack enable
          corepack prepare pnpm@${{ env.PNPM_VERSION }} --activate

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @oasis/db generate

      - name: Migrate and apply RLS
        run: pnpm db:migrate

      - name: RLS smoke
        run: pnpm db:integration

      - name: tRPC context RLS smoke
        run: pnpm api:smoke-context-rls

  encryption-verification:
    name: Encryption dump verification
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: db-integration

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: oasis
          POSTGRES_PASSWORD: oasis
          POSTGRES_DB: oasis_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U oasis"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://oasis:oasis@localhost:5432/oasis_test
      DIRECT_URL: postgres://oasis:oasis@localhost:5432/oasis_test

    steps:
      - uses: actions/checkout@v4

      - name: Enable corepack (pnpm)
        run: |
          corepack enable
          corepack prepare pnpm@${{ env.PNPM_VERSION }} --activate

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @oasis/db generate

      - name: Migrate and apply RLS
        run: pnpm db:migrate

      - name: Seed encrypted smoke data
        run: pnpm db:integration

      - name: Verify encrypted dump
        run: pnpm verify:encryption

  deploy-preview:
    name: Vercel preview deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [verify, db-integration, encryption-verification]
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository

    permissions:
      contents: read
      pull-requests: write

    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_TELEMETRY_DISABLED: '1'

    steps:
      - uses: actions/checkout@v4

      - name: Enable corepack (pnpm)
        run: |
          corepack enable
          corepack prepare pnpm@${{ env.PNPM_VERSION }} --activate

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @oasis/db generate

      - name: Validate Vercel CI secrets
        run: |
          missing=()
          for name in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID; do
            if [ -z "${!name}" ]; then
              missing+=("${name}")
            fi
          done

          if [ "${#missing[@]}" -gt 0 ]; then
            printf 'Missing required GitHub Actions secrets: %s\n' "${missing[*]}" >&2
            printf 'Add the missing secrets under repository Settings > Secrets and variables > Actions before running Vercel deploy jobs.\n' >&2
            exit 1
          fi

      - name: Install Vercel CLI
        run: npm install --global vercel@${{ env.VERCEL_CLI_VERSION }}

      - name: Pull Vercel preview environment
        working-directory: apps/web
        run: vercel pull --yes --environment=preview

      - name: Build preview deployment
        working-directory: apps/web
        run: vercel build

      - name: Deploy preview
        id: deploy
        working-directory: apps/web
        run: |
          deployment_url="$(vercel deploy --prebuilt --archive=tgz)"
          echo "url=${deployment_url}" >> "${GITHUB_OUTPUT}"
          echo "Preview deployment: ${deployment_url}" >> "${GITHUB_STEP_SUMMARY}"

      - name: Comment preview URL
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `Vercel preview: ${{ steps.deploy.outputs.url }}`
            })

  deploy-production:
    name: Vercel production deploy
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [verify, db-integration, encryption-verification]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    env:
      DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
      DIRECT_URL: ${{ secrets.PROD_DIRECT_URL }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_TELEMETRY_DISABLED: '1'

    steps:
      - uses: actions/checkout@v4

      - name: Enable corepack (pnpm)
        run: |
          corepack enable
          corepack prepare pnpm@${{ env.PNPM_VERSION }} --activate

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @oasis/db generate

      - name: Validate production deploy secrets
        run: |
          missing=()
          for name in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID; do
            if [ -z "${!name}" ]; then
              missing+=("${name}")
            fi
          done

          if [ -z "${DATABASE_URL}" ]; then
            missing+=("PROD_DATABASE_URL")
          fi

          if [ -z "${DIRECT_URL}" ]; then
            missing+=("PROD_DIRECT_URL")
          fi

          if [ "${#missing[@]}" -gt 0 ]; then
            printf 'Missing required GitHub Actions secrets: %s\n' "${missing[*]}" >&2
            printf 'Add the missing secrets under repository Settings > Secrets and variables > Actions before running production deploy jobs.\n' >&2
            exit 1
          fi

      - name: Apply production database migrations
        run: pnpm db:migrate

      - name: Install Vercel CLI
        run: npm install --global vercel@${{ env.VERCEL_CLI_VERSION }}

      - name: Pull Vercel production environment
        working-directory: apps/web
        run: vercel pull --yes --environment=production

      - name: Build production deployment
        working-directory: apps/web
        run: vercel build --prod

      - name: Deploy production
        id: deploy
        working-directory: apps/web
        run: |
          deployment_url="$(vercel deploy --prebuilt --prod --archive=tgz)"
          echo "url=${deployment_url}" >> "${GITHUB_OUTPUT}"
          echo "Production deployment: ${deployment_url}" >> "${GITHUB_STEP_SUMMARY}"
