name: Mobile release

# Builds the store versions natively and uploads them. Nothing is sent for review:
# iOS lands in App Store Connect (TestFlight) and Android as a draft production release.
# "Submit for review" in App Store Connect and "Send for review" in Play Console stay manual.
# Runs by itself when a version bump to apps/mobile/app.json lands on main, or by hand to retry.
# Each released version is tagged mobile-vX.Y.Z once both uploads finish, so it never runs twice.
# ios/ and android/ are generated by `expo prebuild`; iOS is archived with Xcode and uploaded to App
# Store Connect, Android is built with Gradle and uploaded to Play. Push stays on Expo's push service.
# Secrets and variables: see docs/mobile-native-builds.md.
on:
  push:
    branches: [main]
    paths: ['apps/mobile/app.json']
  workflow_dispatch:
    inputs:
      platform:
        description: Store builds to make
        type: choice
        options: [all, ios, android]
        default: all

permissions:
  contents: read

concurrency:
  group: mobile-release
  cancel-in-progress: false

env:
  NODE_VERSION: '20'
  PNPM_VERSION: '10.0.0'

jobs:
  # A store will not take a version twice. A push that changes app.json without bumping the
  # version skips quietly; a manual run of a released version fails so the mistake is visible.
  version:
    name: Check version
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
      released: ${{ steps.check.outputs.released }}
    steps:
      - uses: actions/checkout@v6
      - id: check
        run: |
          version="$(node -p "require('./apps/mobile/app.json').expo.version")"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          if git ls-remote --exit-code --tags origin "refs/tags/mobile-v${version}" >/dev/null; then
            echo "released=true" >> "${GITHUB_OUTPUT}"
            echo "Version ${version} is already released (tag mobile-v${version})." >> "${GITHUB_STEP_SUMMARY}"
            if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
              echo "Version ${version} is already released. Bump expo.version first." >&2
              exit 1
            fi
          else
            echo "released=false" >> "${GITHUB_OUTPUT}"
            echo "Releasing version ${version}" >> "${GITHUB_STEP_SUMMARY}"
          fi

  ios:
    name: Release ios
    needs: version
    if: needs.version.outputs.released == 'false' && (inputs.platform || 'all') != 'android'
    runs-on: macos-26
    timeout-minutes: 90
    environment: mobile-release
    env:
      # CocoaPods fails without a UTF-8 locale.
      LANG: en_US.UTF-8
      EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ vars.EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY }}
      EXPO_PUBLIC_TRPC_URL: ${{ vars.EXPO_PUBLIC_TRPC_URL }}
      EXPO_PUBLIC_SUPABASE_URL: ${{ vars.EXPO_PUBLIC_SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
      APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}

    steps:
      - uses: actions/checkout@v6

      - name: Validate signing secrets
        run: |
          for name in APPLE_TEAM_ID ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8; do
            if [ -z "${!name}" ]; then echo "Missing ${name}. See docs/mobile-native-builds.md." >&2; exit 1; fi
          done

      - name: Enable corepack (pnpm)
        run: |
          corepack enable
          corepack prepare pnpm@${{ env.PNPM_VERSION }} --activate

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile --filter "@oasis/mobile..."

      # Also runs `pod install`.
      - name: Generate iOS project
        working-directory: apps/mobile
        run: npx expo prebuild --platform ios --clean

      # Xcode signs automatically with the App Store Connect API key (cloud-managed certificate),
      # so no certificate or provisioning profile is stored in GitHub.
      - name: Archive and upload to App Store Connect
        working-directory: apps/mobile/ios
        run: |
          key="${RUNNER_TEMP}/AuthKey_${ASC_KEY_ID}.p8"
          printf '%s' "${ASC_KEY_P8}" > "${key}"
          auth=(-allowProvisioningUpdates -authenticationKeyPath "${key}"
            -authenticationKeyID "${ASC_KEY_ID}" -authenticationKeyIssuerID "${ASC_ISSUER_ID}")
          cat > "${RUNNER_TEMP}/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>${APPLE_TEAM_ID}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          PLIST
          xcodebuild archive -workspace Oasis.xcworkspace -scheme Oasis -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "${RUNNER_TEMP}/Oasis.xcarchive" \
            DEVELOPMENT_TEAM="${APPLE_TEAM_ID}" CODE_SIGN_STYLE=Automatic "${auth[@]}"
          xcodebuild -exportArchive -archivePath "${RUNNER_TEMP}/Oasis.xcarchive" \
            -exportOptionsPlist "${RUNNER_TEMP}/ExportOptions.plist" \
            -exportPath "${RUNNER_TEMP}/export" "${auth[@]}"
          rm -f "${key}"

      - name: Next steps
        run: |
          {
            echo "### ios: uploaded"
            echo "App Store Connect may take a few minutes to process the build. Then test on TestFlight, attach the build and press Submit for Review."
          } >> "${GITHUB_STEP_SUMMARY}"

  android:
    name: Release android
    needs: version
    if: needs.version.outputs.released == 'false' && (inputs.platform || 'all') != 'ios'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: mobile-release
    env:
      EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ vars.EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY }}
      EXPO_PUBLIC_TRPC_URL: ${{ vars.EXPO_PUBLIC_TRPC_URL }}
      EXPO_PUBLIC_SUPABASE_URL: ${{ vars.EXPO_PUBLIC_SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
      GOOGLE_SERVICES_JSON_CONTENT: ${{ secrets.GOOGLE_SERVICES_JSON }}
      ANDROID_UPLOAD_KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
      ANDROID_UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
      ANDROID_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
      ANDROID_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
      PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}

    steps:
      - uses: actions/checkout@v6

      - name: Validate signing secrets
        run: |
          for name in GOOGLE_SERVICES_JSON_CONTENT ANDROID_UPLOAD_KEYSTORE_BASE64 ANDROID_UPLOAD_KEYSTORE_PASSWORD \
            ANDROID_UPLOAD_KEY_ALIAS ANDROID_UPLOAD_KEY_PASSWORD PLAY_SERVICE_ACCOUNT_JSON; do
            if [ -z "${!name}" ]; then echo "Missing ${name}. See docs/mobile-native-builds.md." >&2; exit 1; fi
          done

      - name: Enable corepack (pnpm)
        run: |
          corepack enable
          corepack prepare pnpm@${{ env.PNPM_VERSION }} --activate

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install
        run: pnpm install --frozen-lockfile --filter "@oasis/mobile..."

      # app.config.js reads the Firebase config path from GOOGLE_SERVICES_JSON (Android push).
      - name: Write Firebase config and upload key
        run: |
          printf '%s' "${GOOGLE_SERVICES_JSON_CONTENT}" > "${RUNNER_TEMP}/google-services.json"
          echo "GOOGLE_SERVICES_JSON=${RUNNER_TEMP}/google-services.json" >> "${GITHUB_ENV}"
          printf '%s' "${ANDROID_UPLOAD_KEYSTORE_BASE64}" | base64 --decode > "${RUNNER_TEMP}/upload.keystore"

      - name: Generate Android project
        working-directory: apps/mobile
        run: npx expo prebuild --platform android --clean --no-install

      # The injected signing properties are how Android Studio signs a release; they replace the
      # debug signing that prebuild puts on release builds.
      - name: Build signed app bundle
        working-directory: apps/mobile/android
        run: >-
          ./gradlew :app:bundleRelease --no-daemon
          -Pandroid.injected.signing.store.file="${RUNNER_TEMP}/upload.keystore"
          -Pandroid.injected.signing.store.password="${ANDROID_UPLOAD_KEYSTORE_PASSWORD}"
          -Pandroid.injected.signing.key.alias="${ANDROID_UPLOAD_KEY_ALIAS}"
          -Pandroid.injected.signing.key.password="${ANDROID_UPLOAD_KEY_PASSWORD}"

      - name: Upload to Play as a draft production release
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: uk.oasis.portal
          releaseFiles: apps/mobile/android/app/build/outputs/bundle/release/app-release.aab
          track: production
          status: draft

      - name: Next steps
        run: |
          {
            echo "### android: uploaded"
            echo "Play Console: open the draft production release, check it, then Send for review."
          } >> "${GITHUB_STEP_SUMMARY}"

  # Marks the version as released. If one platform failed, rerun just that platform by hand:
  # the tag is created once every platform in that run has uploaded.
  tag:
    name: Tag mobile-v${{ needs.version.outputs.version }}
    needs: [version, ios, android]
    # A one-platform manual run skips the other job; tag once every job that ran succeeded.
    if: >-
      always() && needs.version.outputs.released == 'false'
      && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - run: |
          tag="mobile-v${{ needs.version.outputs.version }}"
          git tag "${tag}" "${GITHUB_SHA}"
          git push origin "refs/tags/${tag}"
