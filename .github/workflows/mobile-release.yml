name: Mobile release

# Builds the store versions and uploads them through EAS Submit. Nothing is sent for review:
# iOS lands in App Store Connect (TestFlight) and Android as a draft production release.
# "Submit for review" in App Store Connect and "Send for review" in Play Console stay manual.
# Runs by itself when a version bump to apps/mobile/app.json lands on main, or by hand to retry.
# Each released version is tagged mobile-vX.Y.Z once both uploads finish, so it never runs twice.
on:
  push:
    branches: [main]
    paths: ['apps/mobile/app.json']
  workflow_dispatch:
    inputs:
      platform:
        description: Store builds to make
        type: choice
        options: [all, ios, android]
        default: all

permissions:
  contents: read

concurrency:
  group: mobile-release
  cancel-in-progress: false

env:
  NODE_VERSION: '20'
  PNPM_VERSION: '10.0.0'

jobs:
  # A store will not take a version twice. A push that changes app.json without bumping the
  # version skips quietly; a manual run of a released version fails so the mistake is visible.
  version:
    name: Check version
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
      released: ${{ steps.check.outputs.released }}
    steps:
      - uses: actions/checkout@v6
      - id: check
        run: |
          version="$(node -p "require('./apps/mobile/app.json').expo.version")"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          if git ls-remote --exit-code --tags origin "refs/tags/mobile-v${version}" >/dev/null; then
            echo "released=true" >> "${GITHUB_OUTPUT}"
            echo "Version ${version} is already released (tag mobile-v${version})." >> "${GITHUB_STEP_SUMMARY}"
            if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
              echo "Version ${version} is already released. Bump expo.version first." >&2
              exit 1
            fi
          else
            echo "released=false" >> "${GITHUB_OUTPUT}"
            echo "Releasing version ${version}" >> "${GITHUB_STEP_SUMMARY}"
          fi

  release:
    name: Release ${{ matrix.platform }}
    needs: version
    if: needs.version.outputs.released == 'false'
    runs-on: ubuntu-latest
    # Waits for the build and the store upload so the version is only tagged once both worked.
    timeout-minutes: 120
    environment: mobile-release

    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJSON((inputs.platform || 'all') == 'all' && '["ios","android"]' || format('["{0}"]', inputs.platform)) }}

    env:
      EXPO_TOKEN: ${{ secrets.EXPO_ACCESS_TOKEN }}

    steps:
      - uses: actions/checkout@v6

      - name: Validate EAS build secret
        run: |
          if [ -z "${EXPO_TOKEN}" ]; then
            echo "Missing required GitHub Actions secret: EXPO_ACCESS_TOKEN" >&2
            exit 1
          fi

      - name: Enable corepack (pnpm)
        run: |
          corepack enable
          corepack prepare pnpm@${{ env.PNPM_VERSION }} --activate

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      # eas-cli runs `expo config` locally, which resolves plugins such as expo-router from node_modules.
      - name: Install
        run: pnpm install --frozen-lockfile --filter "@oasis/mobile..."

      - uses: expo/expo-github-action@v8
        with:
          eas-version: 13.x
          token: ${{ secrets.EXPO_ACCESS_TOKEN }}

      - name: Validate EAS config
        working-directory: apps/mobile
        run: node scripts/check-eas-build-config.mjs

      # --auto-submit uploads with the submit profile of the same name once the build finishes.
      - name: Build and submit through EAS
        working-directory: apps/mobile
        run: >-
          eas build --platform ${{ matrix.platform }}
          --profile release-candidate-${{ matrix.platform }}
          --auto-submit --non-interactive

      - name: Next steps
        run: |
          {
            echo "### ${{ matrix.platform }}: uploaded"
            echo "The store may take a few minutes to process the build. Then:"
            if [ "${{ matrix.platform }}" = "ios" ]; then
              echo "- App Store Connect: test on TestFlight, then attach the build and press Submit for Review."
            else
              echo "- Play Console: open the draft production release, check it, then Send for review."
            fi
          } >> "${GITHUB_STEP_SUMMARY}"

  # Marks the version as released. If one platform failed, rerun just that platform by hand:
  # the tag is created once every platform in that run has uploaded.
  tag:
    name: Tag mobile-v${{ needs.version.outputs.version }}
    needs: [version, release]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - run: |
          tag="mobile-v${{ needs.version.outputs.version }}"
          git tag "${tag}" "${GITHUB_SHA}"
          git push origin "refs/tags/${tag}"
