appId: uk.oasis.portal
name: Staff mobile login and navigation smoke
---
- launchApp:
    clearState: true
- assertVisible: Oasis Learning Centre
- assertVisible: Staff and family mobile portal
- tapOn: Email
- inputText: ${E2E_SUPERVISOR_EMAIL}
- tapOn: Password
- inputText: ${E2E_SUPERVISOR_PASSWORD}
- tapOn: Sign in
- assertVisible: Staff Portal
- assertVisible: Home
- assertVisible: Quick actions
- tapOn: Staff communications
- assertVisible: Staff Portal
