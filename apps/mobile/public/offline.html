<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#1B2B5E" />
    <title>Oasis is offline</title>
    <style>
      :root {
        color: #1b2b5e;
        background: #eef2f9;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      }

      body {
        align-items: center;
        display: flex;
        min-height: 100vh;
        margin: 0;
        padding: 24px;
      }

      main {
        background: #ffffff;
        border: 1px solid #dde3f0;
        border-radius: 12px;
        box-shadow: 0 18px 48px rgba(27, 43, 94, 0.12);
        margin: 0 auto;
        max-width: 420px;
        padding: 24px;
      }

      h1 {
        font-size: 22px;
        line-height: 1.2;
        margin: 0 0 8px;
      }

      p {
        color: #5a6a8a;
        font-size: 14px;
        line-height: 1.5;
        margin: 0;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Oasis needs an internet connection</h1>
      <p>
        The app shell is available, but live attendance, messages, wallet, and account data are only
        loaded when this device is back online.
      </p>
    </main>
  </body>
</html>
