services:
  postgres:
    image: postgres:16-alpine
    container_name: oasis-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: oasis_dev
      POSTGRES_USER: oasis
      POSTGRES_PASSWORD: oasis
    ports:
      - "5432:5432"
    volumes:
      - oasis-postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oasis -d oasis_dev"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  oasis-postgres-data:
